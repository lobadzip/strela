name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    # Explicit bash means -eo pipefail: `gradlew | tee` fails when Gradle fails.
    shell: bash

jobs:
  apk:
    name: Publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          ./gradlew :androidApp:assembleRelease --no-daemon -Pstrela.serverUrl=${{ vars.STRELA_SERVER_URL || 'http://10.0.2.2:8080' }} 2>&1 | tee -a gradle.log
          cp androidApp/build/outputs/apk/release/androidApp-release.apk strela-${{ github.ref_name }}.apk

      # Job logs need a signed-in admin; annotations are public. Put the actual Gradle error where anyone can read it.
      - name: Report the Gradle error
        if: failure()
        run: |
          msg=$( { grep -E -A25 "What went wrong|^e: |FAILED$" gradle.log || tail -40 gradle.log; } | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::${msg:-see the job log}"

      - uses: softprops/action-gh-release@v3
        with:
          files: strela-${{ github.ref_name }}.apk
          generate_release_notes: true
