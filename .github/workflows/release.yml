name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          ./gradlew :androidApp:assembleRelease --no-daemon -Pstrela.serverUrl=${{ vars.STRELA_SERVER_URL || 'http://10.0.2.2:8080' }}
          cp androidApp/build/outputs/apk/release/androidApp-release.apk strela-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: strela-${{ github.ref_name }}.apk
          generate_release_notes: true
