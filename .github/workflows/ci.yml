name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Shared and server tests
        run: ./gradlew :shared:jvmTest :server:test --no-daemon

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests
            server/build/reports/tests

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The APK runs its own demo city; this only pre-fills the "connect to a server" dialog.
      - name: Build the release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon -Pstrela.serverUrl=http://10.0.2.2:8080

      - uses: actions/upload-artifact@v4
        with:
          name: strela-apk
          path: androidApp/build/outputs/apk/release/androidApp-release.apk

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the browser app
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: strela-web
          path: composeApp/build/dist/wasmJs/productionExecutable
