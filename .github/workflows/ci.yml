name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Shared and server tests
        run: ./gradlew :shared:jvmTest :server:test --no-daemon 2>&1 | tee -a gradle.log

      # Job logs need a signed-in admin; annotations are public. Put the actual Gradle error where anyone can read it.
      - name: Report the Gradle error
        if: failure()
        run: |
          msg=$(grep -E -A25 "What went wrong|^e: |FAILED$" gradle.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::${msg:-see the job log}"

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            shared/build/reports/tests
            server/build/reports/tests

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      # The APK runs its own demo city; this only pre-fills the "connect to a server" dialog.
      - name: Build the release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon -Pstrela.serverUrl=http://10.0.2.2:8080 2>&1 | tee -a gradle.log

      # Job logs need a signed-in admin; annotations are public. Put the actual Gradle error where anyone can read it.
      - name: Report the Gradle error
        if: failure()
        run: |
          msg=$(grep -E -A25 "What went wrong|^e: |FAILED$" gradle.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::${msg:-see the job log}"

      - uses: actions/upload-artifact@v7
        with:
          name: strela-apk
          path: androidApp/build/outputs/apk/release/androidApp-release.apk

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the browser app
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon 2>&1 | tee -a gradle.log

      # Job logs need a signed-in admin; annotations are public. Put the actual Gradle error where anyone can read it.
      - name: Report the Gradle error
        if: failure()
        run: |
          msg=$(grep -E -A25 "What went wrong|^e: |FAILED$" gradle.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::${msg:-see the job log}"

      - uses: actions/upload-artifact@v7
        with:
          name: strela-web
          path: composeApp/build/dist/wasmJs/productionExecutable
