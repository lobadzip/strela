name: Web demo

# The browser build runs the whole demo city in the page, so GitHub Pages is all the hosting it needs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash means -eo pipefail: `gradlew | tee` fails when Gradle fails.
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the browser app
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon 2>&1 | tee -a gradle.log

      # Job logs need a signed-in admin; annotations are public. Put the actual Gradle error where anyone can read it.
      - name: Report the Gradle error
        if: failure()
        run: |
          msg=$(grep -E -A25 "What went wrong|^e: |FAILED$" gradle.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Gradle::${msg:-see the job log}"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
