<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script>
        // /track/ST-1234 gets this same page; resolve resources from the app's root, wherever it is hosted.
        if (location.pathname.indexOf('/track/') >= 0) {
            document.write('<base href="' + location.pathname.split('/track/')[0] + '/">');
        }
    </script>
    <title>Strela — курьерская доставка на Kotlin Multiplatform</title>
    <meta name="description" content="Демо: приложение курьера и страница отслеживания заказа, один код на Compose Multiplatform.">
    <meta name="theme-color" content="#FF5A1F">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF5A1F'/%3E%3Cpath d='M18.5 5.5 5.5 11v.7l5 1.9 1.9 5h.7z' fill='white'/%3E%3C/svg%3E">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0E1014; }
        #splash {
            position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
            align-items: center; justify-content: center; color: #fff;
            font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 50% 40%, #2A1A14, #0E1014 70%);
            transition: opacity .3s;
        }
        #splash .logo {
            width: 64px; height: 64px; border-radius: 20px; background: #FF5A1F;
            display: grid; place-items: center; animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse { 50% { transform: scale(.92); opacity: .8; } }
    </style>
    <script type="application/javascript" src="strela.js"></script>
</head>
<body>
<div id="splash">
    <div class="logo">
        <svg width="34" height="34" viewBox="0 0 24 24"><path d="M21 3 3 10.53v.98l6.84 2.65L12.48 21h.98z" fill="#fff"/></svg>
    </div>
    <div>Загружаем Strela…</div>
</div>
<script>
    // Compose takes over the body once the wasm module is up; the splash only covers the download.
    new MutationObserver((_, observer) => {
        if (document.querySelector('canvas')) {
            const splash = document.getElementById('splash');
            splash.style.opacity = 0;
            setTimeout(() => splash.remove(), 300);
            observer.disconnect();
        }
    }).observe(document.body, { childList: true, subtree: true });
</script>
</body>
</html>
